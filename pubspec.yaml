name: daily_mate
description: "DailyMate - personal productivity app for macOS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  adhan_dart: ^2.0.1
  clock: ^1.1.2
  collection: ^1.19.1
  cupertino_icons: ^1.0.8
  drift: ">=2.34.0 <2.34.1" # must match drift_dev 2.34.0 (schema tooling)
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.2
  flutter_markdown_plus: ^1.0.12
  freezed_annotation: ^3.1.0
  geolocator: ^14.1.1
  get_it: ^9.3.0
  go_router: ^17.5.0
  intl: ^0.20.3
  logger: ^2.8.0
  path: ^1.9.1
  path_provider: ^2.1.6
  timezone: ^0.11.2

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  # drift_dev >= 2.34.6 and freezed 4 need analyzer 13, which bloc_test's
  # `test` cannot use while flutter_test pins test_api 0.7.11 (Flutter 3.44).
  drift_dev: ">=2.34.0 <2.34.6"
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
