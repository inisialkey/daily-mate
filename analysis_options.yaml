# Lint baseline from flutter@ai-kit (templates/analysis_options.yaml).
include: package:very_good_analysis/analysis_options.yaml

linter:
  rules:
    # Doc comments stay for non-obvious contracts only (ai-kit code-style).
    public_member_api_docs: false
    # very_good_analysis 10.3.0 still defines this; it fires on every port
    # interface. Delete once the repo resolves very_good_analysis 11+.
    one_member_abstracts: false

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.config.dart"
    - "test/drift/**/generated/**"
